name: CI
 
on:
  push:
    branches: [main]
  pull_request:
 
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
 
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: resolvr
          POSTGRES_PASSWORD: resolvr
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U resolvr"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
 
    env:
      # The tests create and migrate resolvr_test themselves; the name must end in _test.
      TEST_DATABASE_URL: postgresql://resolvr:resolvr@localhost:5432/resolvr_test
      TEST_REDIS_URL: redis://localhost:6379/15
 
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: service/requirements-*.txt
 
      - name: Install dependencies
        working-directory: service
        run: pip install -r requirements-dev.txt
 
      - name: Run tests
        working-directory: service
        run: pytest -q -ra
 
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t resolvr-api .
 